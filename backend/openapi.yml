openapi: 3.1.0
info:
  title: Colméia API
  version: 0.1.0
  description: >
    API do ERP Colméia (multi-tenant). Este arquivo cobre os endpoints principais
    de auth, tenants, clients, products, orders, stock, finance, invoices e adapters.
servers:
  - url: http://localhost:3000/api
    description: Local dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        tenantId:
          type: string
          nullable: true
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
            tenantId:
              type: string
            role:
              type: string
    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        document:
          type: string
        email:
          type: string
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [PERSON, COMPANY]
        document:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          type: number
          format: double
    SalesOrder:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        clientId:
          type: string
    Invoice:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        nfeNumber:
          type: integer
    Boleto:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        amount:
          type: number
          format: double
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login com email/senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas

  /tenants:
    get:
      tags: [tenants]
      summary: Lista tenants (apenas superadmin)
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'

  /clients:
    get:
      tags: [clients]
      summary: Lista clientes do tenant atual
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'

  /products:
    get:
      tags: [products]
      summary: Lista produtos do tenant atual
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /orders/sales:
    post:
      tags: [orders]
      summary: Cria um pedido de venda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: number
                        format: double
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'

  /invoices/mock-emit:
    post:
      tags: [invoices]
      summary: Emite NF-e em modo MOCK
      description: >
        Endpoint de mock local que simula envio de XML para SEFAZ (via provider)
        e retorno de protocolo.
      responses:
        '201':
          description: NF-e mock emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /finance/boletos/mock-emit:
    post:
      tags: [finance]
      summary: Emite boleto em modo MOCK
      responses:
        '201':
          description: Boleto mock emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Boleto'

  /finance/boletos/mock-conciliate:
    post:
      tags: [finance]
      summary: Concilia pagamento de boleto em modo MOCK
      responses:
        '200':
          description: Conciliação mock concluída


